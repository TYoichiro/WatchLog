services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: watchlog
      POSTGRES_USER: watchlog
      POSTGRES_PASSWORD: watchlog
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U watchlog -d watchlog"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  app:
    image: node:24-alpine
    working_dir: /app
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    ports:
      - "3000:3000"
    env_file: .env
    environment:
      DATABASE_URL: postgresql://watchlog:watchlog@db:5432/watchlog?schema=public
    command: sh -c "npm ci && npx prisma migrate deploy && npm run dev"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
  node_modules:
