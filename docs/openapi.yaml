openapi: 3.0.3
info:
  title: WatchLog API
  version: 1.0.0
  description: |
    WatchLog の内部 REST API 仕様書です。

    ## 認証
    認証には NextAuth のセッション Cookie（`next-auth.session-token`）を使用します。
    認証が必要なエンドポイントにはセッション Cookie を含むリクエストが必要です。

    ## タイムスタンプ形式
    すべてのタイムスタンプは JST（アジア/東京）タイムゾーンの ISO 8601 文字列で返却されます。

    ## アクセス制御レベル
    - **Public**: 認証不要
    - **Auth (Optional)**: 認証済みの場合はブロック済みユーザーのフィルタリングが適用される
    - **Auth (Required)**: 有効なセッションが必要
    - **Permission**: 特定のパーミッションを持つロールが必要

servers:
  - url: /api
    description: Next.js App Router API

tags:
  - name: Dashboard
    description: ダッシュボード情報
  - name: Room
    description: SHOWROOM ルーム情報（プロキシ）
  - name: Registered Room
    description: ユーザーの登録ルーム管理
  - name: Blocks
    description: ブロック機能
  - name: Onlive
    description: オンライブ（配信視聴）機能
  - name: Live
    description: ライブ情報
  - name: Invitations
    description: 招待コード
  - name: Admin
    description: 管理機能（特権パーミッション必須）
  - name: Admin Maintenance
    description: メンテナンスウィンドウ管理（admin ロール必須）
  - name: Admin Notices
    description: ダッシュボード通知管理（admin ロール必須）
  - name: Auth
    description: NextAuth 認証

paths:
  # ───────────────────────────── Auth ─────────────────────────────
  /auth/{nextauth}:
    get:
      tags: [Auth]
      summary: NextAuth ハンドラー（GET）
      description: NextAuth.js が提供する認証エンドポイント。Google OAuth コールバックなどを処理します。
      parameters:
        - name: nextauth
          in: path
          required: true
          schema:
            type: string
          description: "NextAuth ルートパラメータ（例： callback/google, session）"
      responses:
        "200":
          description: 認証フロー応答
        "302":
          description: リダイレクト
    post:
      tags: [Auth]
      summary: NextAuth ハンドラー（POST）
      description: サインイン・サインアウトなどの認証フォーム送信を処理します。
      parameters:
        - name: nextauth
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
      responses:
        "200":
          description: 認証フロー応答
        "302":
          description: リダイレクト

  # ───────────────────────────── Dashboard ─────────────────────────────
  /dashboard:
    get:
      tags: [Dashboard]
      summary: ダッシュボード統合情報取得
      description: |
        ユーザーの登録ルームに関連する統合情報を並列取得して返します。

        **認証**: 必須（セッション Cookie）
      security:
        - sessionCookie: []
      responses:
        "200":
          description: ダッシュボード情報
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/DashboardOkResponse"
                  - $ref: "#/components/schemas/DashboardIsLiveResponse"
                  - $ref: "#/components/schemas/DashboardNoRoomResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /dashboard/notices:
    get:
      tags: [Dashboard]
      summary: ダッシュボード通知一覧取得
      description: |
        認証済みユーザー向けの掲示通知を取得します。

        **認証**: 必須
      security:
        - sessionCookie: []
      responses:
        "200":
          description: 通知一覧
          content:
            application/json:
              schema:
                type: object
                required: [notices]
                properties:
                  notices:
                    type: array
                    items:
                      $ref: "#/components/schemas/AppNotice"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"

  # ───────────────────────────── Room ─────────────────────────────
  /room/profile:
    get:
      tags: [Room]
      summary: ルームプロフィール取得
      description: SHOWROOM ルームのプロフィール情報を取得します。
      parameters:
        - $ref: "#/components/parameters/room_id"
      responses:
        "200":
          description: ルームプロフィール
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoomProfile"
        "400":
          $ref: "#/components/responses/BadRequest"
        "502":
          $ref: "#/components/responses/BadGateway"

  /room/user-profile:
    get:
      tags: [Room]
      summary: ルームユーザープロフィール取得
      description: SHOWROOM ルームの特定ユーザーのプロフィール情報を取得します。
      parameters:
        - $ref: "#/components/parameters/room_id"
        - name: user_id
          in: query
          required: true
          schema:
            type: string
          description: SHOWROOM ユーザー ID
      responses:
        "200":
          description: ユーザープロフィール
          content:
            application/json:
              schema:
                type: object
                required: [profile]
                properties:
                  profile:
                    $ref: "#/components/schemas/RoomUserProfile"
        "400":
          $ref: "#/components/responses/BadRequest"
        "502":
          $ref: "#/components/responses/BadGateway"

  /room/telop:
    get:
      tags: [Room]
      summary: テロップ取得
      description: ルームのテロップ（テキスト告知）を取得します。
      parameters:
        - $ref: "#/components/parameters/room_id"
      responses:
        "200":
          description: テロップ情報
          content:
            application/json:
              schema:
                type: object
                required: [telop]
                properties:
                  telop:
                    type: string
                    nullable: true
                    description: テロップテキスト。設定されていない場合は null。
        "400":
          $ref: "#/components/responses/BadRequest"
        "502":
          $ref: "#/components/responses/BadGateway"

  /room/paid-gifts:
    get:
      tags: [Room]
      summary: 有料ギフトログ取得
      description: ルームの有料ギフトログ（`isFree === false` のみ）を取得します。
      parameters:
        - $ref: "#/components/parameters/room_id"
      responses:
        "200":
          description: 有料ギフトログ
          content:
            application/json:
              schema:
                type: object
                required: [gifts]
                properties:
                  gifts:
                    type: array
                    items:
                      $ref: "#/components/schemas/RoomGiftLog"
        "400":
          $ref: "#/components/responses/BadRequest"
        "502":
          $ref: "#/components/responses/BadGateway"

  /room/gift-definitions:
    get:
      tags: [Room]
      summary: ギフト定義一覧取得
      description: ルームで使用可能なギフトの定義（名称・画像・ポイント）を取得します。
      parameters:
        - $ref: "#/components/parameters/room_id"
      responses:
        "200":
          description: ギフト定義一覧
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RoomGiftDefinition"
        "400":
          $ref: "#/components/responses/BadRequest"
        "502":
          $ref: "#/components/responses/BadGateway"

  /room/eventandsupport:
    get:
      tags: [Room]
      summary: イベント＆サポート情報取得
      description: ルームの現在参加イベントおよびサポート情報を取得します。
      parameters:
        - $ref: "#/components/parameters/room_id"
      responses:
        "200":
          description: イベント＆サポート情報
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventAndSupportSummary"
        "400":
          $ref: "#/components/responses/BadRequest"
        "502":
          $ref: "#/components/responses/BadGateway"

  /room/activefan:
    get:
      tags: [Room]
      summary: アクティブファン情報取得
      description: 当月のアクティブファン称号・総人数を取得します。
      parameters:
        - $ref: "#/components/parameters/room_id"
      responses:
        "200":
          description: アクティブファン情報
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActiveFanSummary"
        "400":
          $ref: "#/components/responses/BadRequest"
        "502":
          $ref: "#/components/responses/BadGateway"

  /room/status:
    get:
      tags: [Room]
      summary: ルーム配信ステータス取得
      description: ルームの配信中/停止ステータスを取得します。
      parameters:
        - name: room_url_key
          in: query
          required: true
          schema:
            type: string
          description: SHOWROOM ルーム URL キー（例： `example_room`）
      responses:
        "200":
          description: ルームステータス
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoomStatus"
        "400":
          $ref: "#/components/responses/BadRequest"
        "502":
          $ref: "#/components/responses/BadGateway"

  /room/search:
    get:
      tags: [Room]
      summary: ルーム検索
      description: キーワードで SHOWROOM ルームを検索します。
      parameters:
        - name: keyword
          in: query
          required: true
          schema:
            type: string
            minLength: 1
          description: 検索キーワード（前後の空白は自動トリム）
      responses:
        "200":
          description: 検索結果
          content:
            application/json:
              schema:
                type: object
                required: [rooms]
                properties:
                  rooms:
                    type: array
                    items:
                      $ref: "#/components/schemas/RoomSearchResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "502":
          $ref: "#/components/responses/BadGateway"

  /room/total-ranking:
    get:
      tags: [Room]
      summary: 総合ランキング取得
      description: |
        ルームの総合（月間）ランキングを取得します。
        認証済みの場合、ブロック済みユーザーはリストから除外されます。

        **認証**: 任意
      parameters:
        - $ref: "#/components/parameters/room_id"
      responses:
        "200":
          description: 総合ランキング
          content:
            application/json:
              schema:
                type: object
                required: [ranking]
                properties:
                  ranking:
                    type: array
                    items:
                      $ref: "#/components/schemas/RoomTotalRankingUser"
        "400":
          $ref: "#/components/responses/BadRequest"
        "502":
          $ref: "#/components/responses/BadGateway"

  /room/live-ranking:
    get:
      tags: [Room]
      summary: ライブランキング取得
      description: |
        現在配信中のライブランキング（ステージユーザーリスト）を取得します。
        認証済みの場合、ブロック済みユーザーはリストから除外されます。

        **認証**: 任意
      parameters:
        - $ref: "#/components/parameters/room_id"
      responses:
        "200":
          description: ライブランキング
          content:
            application/json:
              schema:
                type: object
                required: [ranking]
                properties:
                  ranking:
                    type: array
                    items:
                      $ref: "#/components/schemas/RoomLiveRankingUser"
        "400":
          $ref: "#/components/responses/BadRequest"
        "502":
          $ref: "#/components/responses/BadGateway"

  /room/gifts:
    get:
      tags: [Room]
      summary: ギフトログ取得
      description: |
        ルームのギフトログを取得します。30 秒以内の同一ユーザー・同一ギフトは集約されます。
        認証済みの場合、ブロック済みユーザーのギフトは除外されます。

        **認証**: 任意
      parameters:
        - $ref: "#/components/parameters/room_id"
      responses:
        "200":
          description: ギフトログ
          content:
            application/json:
              schema:
                type: object
                required: [gifts]
                properties:
                  gifts:
                    type: array
                    items:
                      $ref: "#/components/schemas/RoomGiftLog"
        "400":
          $ref: "#/components/responses/BadRequest"
        "502":
          $ref: "#/components/responses/BadGateway"

  /room/comments:
    get:
      tags: [Room]
      summary: コメントログ取得
      description: |
        ルームのコメントログを取得します。
        認証済みの場合、ブロック済みユーザーのコメントは除外されます。

        **認証**: 任意
      parameters:
        - $ref: "#/components/parameters/room_id"
      responses:
        "200":
          description: コメントログ
          content:
            application/json:
              schema:
                type: object
                required: [comments]
                properties:
                  comments:
                    type: array
                    items:
                      $ref: "#/components/schemas/RoomComment"
        "400":
          $ref: "#/components/responses/BadRequest"
        "502":
          $ref: "#/components/responses/BadGateway"

  # ───────────────────────────── Registered Room ─────────────────────────────
  /registered-room:
    get:
      tags: [Registered Room]
      summary: 登録ルーム取得
      description: |
        ログインユーザーの登録ルームを取得します。

        **認証**: 必須
      security:
        - sessionCookie: []
      responses:
        "200":
          description: 登録ルーム情報
          content:
            application/json:
              schema:
                type: object
                required: [room]
                properties:
                  room:
                    nullable: true
                    oneOf:
                      - $ref: "#/components/schemas/UserRegisteredRoom"
                    description: 登録ルーム。未登録の場合は null。
        "401":
          $ref: "#/components/responses/Unauthorized"

    put:
      tags: [Registered Room]
      summary: 登録ルーム保存
      description: |
        ユーザーのルームを登録します。招待コードが必要です。
        招待コードは消費され、ユーザーに新しい招待コードが払い出されます。
        操作は監査ログに記録されます。

        **認証**: 必須
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisteredRoomRequest"
      responses:
        "200":
          description: 登録成功
          content:
            application/json:
              schema:
                type: object
                required: [room]
                properties:
                  room:
                    $ref: "#/components/schemas/UserRegisteredRoom"
        "400":
          description: バリデーションエラーまたは招待コード不正
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: ルームまたは招待コードが既に使用済み
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ───────────────────────────── Blocks ─────────────────────────────
  /blocks:
    get:
      tags: [Blocks]
      summary: ブロックリスト取得
      description: |
        ログインユーザーがブロックしている SHOWROOM ユーザーの一覧を取得します。

        **認証**: 必須
      security:
        - sessionCookie: []
      responses:
        "200":
          description: ブロックリスト
          content:
            application/json:
              schema:
                type: object
                required: [blocks]
                properties:
                  blocks:
                    type: array
                    items:
                      $ref: "#/components/schemas/BlockEntry"
        "401":
          $ref: "#/components/responses/Unauthorized"

    post:
      tags: [Blocks]
      summary: ユーザーをブロック
      description: |
        指定した SHOWROOM ユーザーをブロックします。
        開発者ユーザーはブロックできません。

        **認証**: 必須
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBlockRequest"
      responses:
        "200":
          description: ブロック成功
          content:
            application/json:
              schema:
                type: object
                required: [block]
                properties:
                  block:
                    $ref: "#/components/schemas/BlockEntry"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: 開発者ユーザーのブロック禁止
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /blocks/{blockId}:
    delete:
      tags: [Blocks]
      summary: ブロック解除
      description: |
        指定した ID のブロックを解除します。
        自分が作成したブロックのみ削除できます。

        **認証**: 必須
      security:
        - sessionCookie: []
      parameters:
        - name: blockId
          in: path
          required: true
          schema:
            type: string
          description: ブロック ID
      responses:
        "200":
          description: 解除成功
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok:
                    type: boolean
                    example: true
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  # ───────────────────────────── Live ─────────────────────────────
  /live/liveinfo:
    get:
      tags: [Live]
      summary: ライブ情報取得
      description: |
        指定ルームのライブ情報（配信キー・ライブ ID・ステータス）を取得します。
        認証済みかつ `initial=1` パラメータが指定された場合、配信中の場合はアクセスログを記録します。

        **認証**: 任意
      parameters:
        - $ref: "#/components/parameters/room_id"
        - name: initial
          in: query
          required: false
          schema:
            type: string
            enum: ["1"]
          description: 初回アクセスフラグ。`1` を指定するとアクセスログが記録されます。
      responses:
        "200":
          description: ライブ情報
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoomLiveInfo"
        "400":
          $ref: "#/components/responses/BadRequest"
        "502":
          $ref: "#/components/responses/BadGateway"

  # ───────────────────────────── Onlive ─────────────────────────────
  /onlive/init:
    get:
      tags: [Onlive]
      summary: オンライブ初期化データ取得
      description: |
        オンライブ画面の初期表示に必要なデータ（ライブ情報・ギフト定義・コメント・ギフト・テロップ）を
        一括取得します。認証済みの場合はブロック済みユーザーのコメント・ギフトが除外されます。

        **認証**: 任意
      security:
        - sessionCookie: []
      responses:
        "200":
          description: 初期化データ
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/OnliveInitOkResponse"
                  - $ref: "#/components/schemas/OnliveNoRoomResponse"

  /onlive/poll:
    get:
      tags: [Onlive]
      summary: オンライブポーリング
      description: |
        オンライブ画面のポーリング更新用エンドポイント。
        プロフィール・ライブランキング・総合ランキングを返します。
        認証済みの場合はブロック済みユーザーのランキングが除外されます。

        **認証**: 任意
      security:
        - sessionCookie: []
      responses:
        "200":
          description: ポーリング応答
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OnlivePollResponse"
        "404":
          description: 登録ルームなし
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /onlive/logs:
    post:
      tags: [Onlive]
      summary: オンライブログ保存
      description: |
        クライアントが収集したオンライブログを保存します。
        保存時にサーバー側でも総合ランキングを取得してログにマージします。
        ユーザーの登録ルームと一致しない `roomId` は拒否されます。

        **認証**: 必須
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OnliveLogRequest"
      responses:
        "200":
          description: 保存成功
          content:
            application/json:
              schema:
                type: object
                required: [log]
                properties:
                  log:
                    $ref: "#/components/schemas/OnliveLog"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: ユーザーの登録ルームと roomId が不一致
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /onlive/logs/{logId}:
    delete:
      tags: [Onlive]
      summary: オンライブログ削除
      description: |
        指定 ID のオンライブログを削除します。自分が保存したログのみ削除できます。

        **認証**: 必須
      security:
        - sessionCookie: []
      parameters:
        - name: logId
          in: path
          required: true
          schema:
            type: string
          description: オンライブログ ID
      responses:
        "200":
          description: 削除成功
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok:
                    type: boolean
                    example: true
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  # ───────────────────────────── Invitations ─────────────────────────────
  /invitations:
    post:
      tags: [Invitations]
      summary: 招待コード生成
      description: |
        新しい招待コードを生成します。

        **ロール**: `admin`
      security:
        - sessionCookie: []
      responses:
        "201":
          description: 生成成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserInvitationCode"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /invitations/verify:
    post:
      tags: [Invitations]
      summary: 招待コード検証
      description: |
        招待コードが有効かどうかを検証します。コードは消費されません。

        **認証**: 必須
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [inviteCode]
              properties:
                inviteCode:
                  type: string
                  description: 検証する招待コード
      responses:
        "200":
          description: 検証結果
          content:
            application/json:
              schema:
                type: object
                required: [valid]
                properties:
                  valid:
                    type: boolean
                    description: 有効な招待コードの場合 true
        "401":
          $ref: "#/components/responses/Unauthorized"

  # ───────────────────────────── Admin ─────────────────────────────
  /admin/users:
    get:
      tags: [Admin]
      summary: ユーザー一覧取得
      description: |
        全ユーザーとそのロールを取得します。

        **パーミッション**: `user.read`
      security:
        - sessionCookie: []
      responses:
        "200":
          description: ユーザー一覧
          content:
            application/json:
              schema:
                type: object
                required: [users]
                properties:
                  users:
                    type: array
                    items:
                      $ref: "#/components/schemas/AdminUser"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /admin/users/{userId}/roles:
    post:
      tags: [Admin]
      summary: ユーザーへのロール割り当て
      description: |
        指定ユーザーにロールを割り当てます（upsert）。
        `admin` ロールは API 経由では割り当て不可です。
        操作は監査ログに記録されます。

        **パーミッション**: `role.assign`
      security:
        - sessionCookie: []
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
          description: ロール割り当て対象のユーザー ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [roleId]
              properties:
                roleId:
                  type: string
                  description: 割り当てるロール ID
      responses:
        "200":
          description: ロール割り当て成功
          content:
            application/json:
              schema:
                type: object
                required: [userRole]
                properties:
                  userRole:
                    $ref: "#/components/schemas/UserRoleResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: パーミッション不足、または admin ロールの割り当て試行
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: 対象ユーザーまたはロールが存在しない
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /admin/audit-logs:
    get:
      tags: [Admin]
      summary: 監査ログ取得
      description: |
        システム監査ログ（ルーム登録・ロール割り当て等）を取得します。

        **パーミッション**: `audit.read`
      security:
        - sessionCookie: []
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 50
            maximum: 100
          description: 取得件数上限（最大 100）
      responses:
        "200":
          description: 監査ログ一覧
          content:
            application/json:
              schema:
                type: object
                required: [auditLogs]
                properties:
                  auditLogs:
                    type: array
                    items:
                      $ref: "#/components/schemas/AuditLog"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /admin/users/{userId}/role:
    patch:
      tags: [Admin]
      summary: ユーザーロール設定
      description: |
        指定ユーザーのロールを `premiumuser` または `general`（プレミアム剥奪）に設定します。
        `premiumuser` への変更は upsert、`general` への変更は premiumuser ロールを削除します。
        操作は監査ログに記録されます。

        **パーミッション**: `role.assign`
      security:
        - sessionCookie: []
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
          description: ロール設定対象のユーザー ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role:
                  type: string
                  enum: [premiumuser, general]
                  description: 設定するロール名
      responses:
        "200":
          description: ロール設定成功
          content:
            application/json:
              schema:
                type: object
                required: [role]
                properties:
                  role:
                    type: string
                    enum: [premiumuser, general]
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /admin/sessions/cleanup:
    post:
      tags: [Admin]
      summary: 期限切れセッション削除
      description: |
        `sessions.expires` が実行時点より過去のセッションレコードを削除します。
        操作は監査ログに記録されます。

        **ロール**: `admin`
      security:
        - sessionCookie: []
      responses:
        "200":
          description: 期限切れセッション削除結果
          content:
            application/json:
              schema:
                type: object
                required: [deletedCount, expiredBefore]
                properties:
                  deletedCount:
                    type: integer
                    minimum: 0
                    description: 削除されたセッションレコード数
                  expiredBefore:
                    type: string
                    format: date-time
                    description: この日時より前に期限切れだったセッションを削除
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"

  # ───────────────────────────── Admin Maintenance ─────────────────────────────
  /admin/maintenance:
    get:
      tags: [Admin Maintenance]
      summary: メンテナンスウィンドウ一覧取得
      description: |
        全メンテナンスウィンドウを `startsAt` 降順で取得します。

        **ロール**: `admin`
      security:
        - sessionCookie: []
      responses:
        "200":
          description: メンテナンスウィンドウ一覧
          content:
            application/json:
              schema:
                type: object
                required: [maintenanceWindows]
                properties:
                  maintenanceWindows:
                    type: array
                    items:
                      $ref: "#/components/schemas/MaintenanceWindow"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"

    post:
      tags: [Admin Maintenance]
      summary: メンテナンスウィンドウ作成
      description: |
        新しいメンテナンスウィンドウを作成します。
        `startsAt` および `endsAt` は JST 壁時刻の文字列（`parseJstWallTime` でパース）。
        `isEnabled` のデフォルトは `true`。
        操作は監査ログに記録されます。

        **ロール**: `admin`
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MaintenanceWindowRequest"
      responses:
        "201":
          description: 作成成功
          content:
            application/json:
              schema:
                type: object
                required: [maintenanceWindow]
                properties:
                  maintenanceWindow:
                    $ref: "#/components/schemas/MaintenanceWindow"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /admin/maintenance/{id}:
    patch:
      tags: [Admin Maintenance]
      summary: メンテナンスウィンドウ更新
      description: |
        指定 ID のメンテナンスウィンドウを部分更新します。
        省略したフィールドは現在の値を維持します。
        操作は監査ログに記録されます。

        **ロール**: `admin`
      security:
        - sessionCookie: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: メンテナンスウィンドウ ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MaintenanceWindowPatchRequest"
      responses:
        "200":
          description: 更新成功
          content:
            application/json:
              schema:
                type: object
                required: [maintenanceWindow]
                properties:
                  maintenanceWindow:
                    $ref: "#/components/schemas/MaintenanceWindow"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

    delete:
      tags: [Admin Maintenance]
      summary: メンテナンスウィンドウ削除
      description: |
        指定 ID のメンテナンスウィンドウを削除します。
        操作は監査ログに記録されます。

        **ロール**: `admin`
      security:
        - sessionCookie: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: メンテナンスウィンドウ ID
      responses:
        "200":
          description: 削除成功
          content:
            application/json:
              schema:
                type: object
                required: [id]
                properties:
                  id:
                    type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

  # ───────────────────────────── Admin Notices ─────────────────────────────
  /admin/notices:
    get:
      tags: [Admin Notices]
      summary: ダッシュボード通知一覧取得（管理）
      description: |
        全ダッシュボード通知を `publishedAt` 降順で取得します（期限切れ・非公開を含む）。

        **ロール**: `admin`
      security:
        - sessionCookie: []
      responses:
        "200":
          description: 通知一覧
          content:
            application/json:
              schema:
                type: object
                required: [notices]
                properties:
                  notices:
                    type: array
                    items:
                      $ref: "#/components/schemas/AdminNotice"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"

    post:
      tags: [Admin Notices]
      summary: ダッシュボード通知作成
      description: |
        新しいダッシュボード通知を作成します。
        `publishedAt` は必須。`expiresAt` は省略可（省略時は無期限）。
        `displayTarget` のデフォルトは `AUTHENTICATED`。
        操作は監査ログに記録されます。

        **ロール**: `admin`
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminNoticeRequest"
      responses:
        "201":
          description: 作成成功
          content:
            application/json:
              schema:
                type: object
                required: [notice]
                properties:
                  notice:
                    $ref: "#/components/schemas/AdminNotice"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /admin/notices/{id}:
    patch:
      tags: [Admin Notices]
      summary: ダッシュボード通知更新
      description: |
        指定 ID のダッシュボード通知を部分更新します。
        省略したフィールドは現在の値を維持します。
        `expiresAt` に `null` または空文字を指定すると有効期限を削除します。
        操作は監査ログに記録されます。

        **ロール**: `admin`
      security:
        - sessionCookie: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: 通知 ID（整数）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminNoticePatchRequest"
      responses:
        "200":
          description: 更新成功
          content:
            application/json:
              schema:
                type: object
                required: [notice]
                properties:
                  notice:
                    $ref: "#/components/schemas/AdminNotice"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

    delete:
      tags: [Admin Notices]
      summary: ダッシュボード通知削除
      description: |
        指定 ID のダッシュボード通知を削除します。
        操作は監査ログに記録されます。

        **ロール**: `admin`
      security:
        - sessionCookie: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: 通知 ID（整数）
      responses:
        "200":
          description: 削除成功
          content:
            application/json:
              schema:
                type: object
                required: [id]
                properties:
                  id:
                    type: integer
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

# ─────────────────────────── Components ───────────────────────────
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: next-auth.session-token
      description: NextAuth セッション Cookie

  parameters:
    room_id:
      name: room_id
      in: query
      required: true
      schema:
        type: string
      description: SHOWROOM ルーム ID

  responses:
    BadRequest:
      description: リクエストパラメータが不正
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: 未認証（セッションなし）
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error: Unauthorized
    Forbidden:
      description: パーミッション不足
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: リソースが存在しない、または権限なし
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InternalServerError:
      description: サーバー内部エラー
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error: Internal Server Error
    BadGateway:
      description: 上流 SHOWROOM API の取得失敗
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error: Failed to fetch upstream API

  schemas:
    # ── 共通 ──
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string

    # ── Dashboard ──
    AppNotice:
      type: object
      required: [id, title, date, body]
      properties:
        id:
          type: integer
          description: 通知 ID
        title:
          type: string
          description: タイトル
        date:
          type: string
          description: "掲載日時（JST、例： 2025/05/11 12:00）"
        body:
          type: string
          description: 本文
        linkUrl:
          type: string
          nullable: true
          description: 外部リンク URL（http/https のみ）

    DashboardNoRoomResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [no_room]

    DashboardIsLiveResponse:
      type: object
      required: [status, isAdmin, registeredRoom, profile, activeFan, eventAndSupport, notices, noticesHasError, roomStatus]
      properties:
        status:
          type: string
          enum: [is_live]
        isAdmin:
          type: boolean
        registeredRoom:
          $ref: "#/components/schemas/UserRegisteredRoom"
        profile:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/RoomProfile"
        activeFan:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/ActiveFanSummary"
        eventAndSupport:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/EventAndSupportSummary"
        notices:
          type: array
          items:
            $ref: "#/components/schemas/AppNotice"
        noticesHasError:
          type: boolean
        roomStatus:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/RoomStatus"

    DashboardOkResponse:
      type: object
      required: [status, isAdmin, registeredRoom, profile, activeFan, eventAndSupport, notices, noticesHasError, roomStatus]
      properties:
        status:
          type: string
          enum: [ok]
        isAdmin:
          type: boolean
        registeredRoom:
          $ref: "#/components/schemas/UserRegisteredRoom"
        profile:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/RoomProfile"
        activeFan:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/ActiveFanSummary"
        eventAndSupport:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/EventAndSupportSummary"
        notices:
          type: array
          items:
            $ref: "#/components/schemas/AppNotice"
        noticesHasError:
          type: boolean
        roomStatus:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/RoomStatus"

    # ── Room ──
    RoomProfile:
      type: object
      required:
        - roomId
        - roomUrlKey
        - roomName
        - roomImageUrl
        - isOnlive
        - premiumRoomType
        - followerNum
        - genreName
        - isOfficial
        - roomLevel
        - leagueLabel
        - showRankSubdivided
        - nextShowRankSubdivided
      properties:
        roomId:
          type: integer
        roomUrlKey:
          type: string
        roomName:
          type: string
        roomImageUrl:
          type: string
          format: uri
        isOnlive:
          type: boolean
        premiumRoomType:
          type: integer
        followerNum:
          type: string
          description: "ロケール整形済みの数値文字列（例： 10,000）"
        viewNum:
          type: integer
          nullable: true
        genreName:
          type: string
        isOfficial:
          type: boolean
        roomLevel:
          type: string
          description: "ロケール整形済みのルームレベル"
        leagueLabel:
          type: string
        showRankSubdivided:
          type: string
          description: "現在のランク表示（例： A-3）"
        showRankTimeCharge:
          type: string
          nullable: true
          description: "ランクに対応する時間課金額（例： ¥730）"
        nextShowRankSubdivided:
          type: string
        currentLiveStartedAt:
          type: integer
          nullable: true
          description: 配信開始 Unix タイムスタンプ（秒）

    RoomStatus:
      type: object
      required: [isLive, roomUrlKey]
      properties:
        broadcastHost:
          type: string
          nullable: true
        broadcastKey:
          type: string
          nullable: true
        broadcastPort:
          type: integer
          nullable: true
        isLive:
          type: boolean
        liveStatus:
          type: integer
          nullable: true
        roomId:
          type: integer
          nullable: true
        roomUrlKey:
          type: string

    RoomLiveInfo:
      type: object
      required: [bcsvrKey, liveId, liveStatus]
      properties:
        bcsvrKey:
          type: string
          nullable: true
          description: 配信サーバーキー
        liveId:
          type: string
          nullable: true
          description: 現在のライブ ID
        liveStatus:
          type: integer
          nullable: true
          description: "配信ステータス（1 = 停止中、それ以外 = 配信中）"

    EventAndSupportSummary:
      type: object
      required: [event, support, ranking]
      properties:
        event:
          nullable: true
          type: object
          required: [id, name, imageUrl, startAt, endAt, eventUrl]
          properties:
            id:
              type: integer
            name:
              type: string
            imageUrl:
              type: string
              format: uri
            startAt:
              type: integer
              description: Unix タイムスタンプ（秒）
            endAt:
              type: integer
              description: Unix タイムスタンプ（秒）
            eventUrl:
              type: string
              format: uri
        support:
          nullable: true
          type: object
          required: [id, name]
          properties:
            id:
              type: integer
            name:
              type: string
        ranking:
          nullable: true
          type: object
          required: [rank, beforeRank, point, gap]
          properties:
            rank:
              type: integer
            beforeRank:
              type: integer
            point:
              type: string
              description: "ロケール整形済みポイント数（例： 12,345）"
            gap:
              type: string
              description: "前回ランクとの差（例： 500）"

    ActiveFanSummary:
      type: object
      required: [fanName, totalUserCount]
      properties:
        fanName:
          type: string
          description: アクティブファン称号名
        totalUserCount:
          type: string
          description: "ロケール整形済みのファン総数（例： 1,234）"

    RoomSearchResult:
      type: object
      required: [imageUrl, roomId, roomName, roomUrl]
      properties:
        imageUrl:
          type: string
          format: uri
        roomId:
          type: string
        roomName:
          type: string
        roomUrl:
          type: string
          description: ルーム URL キー（例： `example_room`）

    RoomGiftDefinition:
      type: object
      required: [giftId, giftName, isFree]
      properties:
        giftId:
          type: integer
        giftImageUrl:
          type: string
          nullable: true
          format: uri
        giftName:
          type: string
        isFree:
          type: boolean
        point:
          type: integer
          nullable: true
          description: "ギフトポイント。無料ギフトは 0。有料ギフトで不明な場合は null。"

    RoomGiftLog:
      type: object
