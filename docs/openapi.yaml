    # ── Admin Maintenance ──
    MaintenanceWindow:
      type: object
      required: [id, title, startsAt, endsAt, isEnabled, createdAt, updatedAt]
      properties:
        id:
          type: string
          description: メンテナンスウィンドウ ID（cuid）
        title:
          type: string
        message:
          type: string
          nullable: true
          description: 詳細メッセージ
        startsAt:
          type: string
          format: date-time
          description: 開始日時（JST ISO 8601）
        endsAt:
          type: string
          format: date-time
          description: 終了日時（JST ISO 8601）
        isEnabled:
          type: boolean
          description: 有効フラグ
        createdAt:
          type: string
          format: date-time
          description: JST ISO 8601
        updatedAt:
          type: string
          format: date-time
          description: JST ISO 8601

    MaintenanceWindowRequest:
      type: object
      required: [title, startsAt, endsAt]
      properties:
        title:
          type: string
          description: タイトル（空白のみ不可）
        message:
          type: string
          description: 詳細メッセージ（省略可）
        startsAt:
          type: string
          description: 開始日時（JST 壁時刻文字列）
        endsAt:
          type: string
          description: 終了日時（JST 壁時刻文字列）。startsAt より後である必要あり。
        isEnabled:
          type: boolean
          description: 有効フラグ（デフォルト true）

    MaintenanceWindowPatchRequest:
      type: object
      properties:
        title:
          type: string
          description: タイトル（空白のみ不可）
        message:
          type: string
          nullable: true
          description: 詳細メッセージ（null または空文字で削除）
        startsAt:
          type: string
          description: 開始日時（JST 壁時刻文字列）
        endsAt:
          type: string
          description: 終了日時（JST 壁時刻文字列）
        isEnabled:
          type: boolean

    # ── Admin Notices ──
    AdminNotice:
      type: object
      required: [id, title, content, displayTarget, publishedAt, createdAt, updatedAt]
      properties:
        id:
          type: integer
        title:
          type: string
        content:
          type: string
        displayTarget:
          type: string
          enum: [AUTHENTICATED, LOGIN, ALL]
          description: |
            表示対象。
            - `AUTHENTICATED`: 認証済みユーザーのダッシュボード
            - `LOGIN`: ログイン画面
            - `ALL`: 両方
        publishedAt:
          type: string
          format: date-time
          description: 公開日時（JST ISO 8601）
        expiresAt:
          type: string
          format: date-time
          nullable: true
          description: 有効期限（JST ISO 8601）。null の場合は無期限。
        linkUrl:
          type: string
          nullable: true
          description: 外部リンク URL（http/https のみ）
        createdAt:
          type: string
          format: date-time
          description: JST ISO 8601
        updatedAt:
          type: string
          format: date-time
          description: JST ISO 8601

    AdminNoticeRequest:
      type: object
      required: [title, content, publishedAt]
      properties:
        title:
          type: string
          description: タイトル（空白のみ不可）
        content:
          type: string
          description: 本文（空白のみ不可）
        displayTarget:
          type: string
          enum: [AUTHENTICATED, LOGIN, ALL]
          description: 表示対象（デフォルト AUTHENTICATED）
        publishedAt:
          type: string
          description: 公開日時（JST 壁時刻文字列）
        expiresAt:
          type: string
          description: 有効期限（JST 壁時刻文字列）。省略可。publishedAt より後である必要あり。
        linkUrl:
          type: string
          description: 外部リンク URL（省略可）

    AdminNoticePatchRequest:
      type: object
      properties:
        title:
          type: string
          description: タイトル（空白のみ不可）
        content:
          type: string
          description: 本文（空白のみ不可）
        displayTarget:
          type: string
          enum: [AUTHENTICATED, LOGIN, ALL]
        publishedAt:
          type: string
          description: 公開日時（JST 壁時刻文字列）
        expiresAt:
          type: string
          nullable: true
          description: 有効期限（JST 壁時刻文字列）。null または空文字で削除。
        linkUrl:
          type: string
          nullable: true
          description: 外部リンク URL（null または空文字で削除）

    AuditLog:
      type: object
      required: [id, action, resource, detail, createdAt]
      properties:
        id:
          type: string
        actorUserId:
          type: string
          nullable: true
        action:
          type: string
          description: "操作種別（例： room.register, role.assign）"
        resource:
          type: string
          description: "操作対象リソース種別（例： UserRegisteredRoom, UserRole）"
        resourceId:
          type: string
          nullable: true
        detail:
          type: object
          description: 操作の詳細情報（任意の JSON）
          additionalProperties: true
        createdAt:
          type: string
          format: date-time
          description: JST ISO 8601
        actor:
          nullable: true
          type: object
          required: [id]
          properties:
            id:
              type: string
            name:
              type: string
              nullable: true
            email:
              type: string
              nullable: true
              format: email
            image:
              type: string
              nullable: true
              format: uri
